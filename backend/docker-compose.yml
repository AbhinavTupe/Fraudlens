services:
  db:
    image: postgres:16-alpine
    container_name: fraudlens-db
    environment:
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: fraudlens
      POSTGRES_DB: fraudlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens -d fraudlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: fraudlens-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app/uploads:/app/app/uploads
      - ./app/ml/artifacts:/app/app/ml/artifacts

volumes:
  postgres_data:
